<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trainer Tools</title>

  <!-- App auf dem Homescreen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trainer Tools">

  <!-- Start mit Versionsnummer (Cache-Busting):
       version.json wird immer frisch geholt, danach werden ALLE Dateien
       mit "?v=<Version>" geladen → nie eine Mischung aus alt und neu.
       ⚠️ Neue JS-Datei? → unten in MODULE eintragen.
       ⚠️ Bei jedem Pull Request die Version in version.json erhöhen. -->
  <script>
    (function () {
      var MODULE = ['app', 'admin', 'config', 'supabase', 'ui', 'kontext', 'nummern', 'kader',
        'linien', 'linien-auswertung', 'linien-ideen', 'statistik', 'statistik-logik'];
      function start(v) {
        window.APP_V = v || '';
        var q = v ? '?v=' + encodeURIComponent(v) : '';
        if (q) {
          var imports = {};
          MODULE.forEach(function (m) { imports['./' + m + '.js'] = './' + m + '.js' + q; });
          var map = document.createElement('script');
          map.type = 'importmap';
          map.textContent = JSON.stringify({ imports: imports });
          document.head.appendChild(map);
        }
        var css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = 'style.css' + q;
        document.head.appendChild(css);
        var app = document.createElement('script');
        app.type = 'module'; app.src = 'app.js' + q;
        document.head.appendChild(app);
      }
      var fertig = false;
      function einmal(v) { if (!fertig) { fertig = true; start(v); } }
      setTimeout(function () { einmal(''); }, 4000);   // kein Netz? → ohne Version starten
      fetch('version.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) { einmal(j.v); })
        .catch(function () { einmal(''); });
    })();
  </script>
</head>
<body>

  <!-- Ladebildschirm -->
  <div id="boot" class="boot">
    <img src="icon.svg" alt="" width="72" height="72">
    <p id="boot-text">Lade …</p>
  </div>
  <script>
    // Falls nach 12 s nichts passiert: Hinweis anzeigen
    setTimeout(() => {
      const b = document.getElementById('boot');
      if (b && !b.hidden) document.getElementById('boot-text').textContent =
        'Lädt nicht? Internetverbindung prüfen und Seite neu laden.';
    }, 12000);
  </script>

  <!-- Login -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="icon.svg" alt="" width="64" height="64">
      <h1>Trainer Tools</h1>
      <p class="muted">Login für den Trainerstaff</p>
      <label>E-Mail
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Passwort
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn primary">Einloggen</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- App -->
  <section id="app-view" hidden>
    <header class="topbar">
      <a href="#/" class="brand">
        <img src="icon.svg" alt="" width="28" height="28">
        <span id="app-title">Trainer Tools</span>
      </a>
      <span id="page-title" class="page-title"></span>
      <button id="logout" class="btn ghost small" title="Abmelden">Logout</button>
    </header>
    <main id="view"></main>
  </section>

</body>
</html>
